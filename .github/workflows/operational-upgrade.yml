name: Apply operational upgrade

on:
  push:
    branches: [main]
    paths:
      - scripts/operational-upgrade.py

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: python3 scripts/operational-upgrade.py
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write src/lib/operations.ts src/routes/locacoes.nova.tsx src/routes/configuracoes.tsx
      - run: bunx tsc --noEmit
      - run: bun run build
      - run: bun run lint
      - name: Commit operational upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/operations.ts src/routes/locacoes.nova.tsx src/routes/configuracoes.tsx
          git commit -m "feat: harden daily rental operations"
          git push
