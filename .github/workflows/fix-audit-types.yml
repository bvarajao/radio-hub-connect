name: Fix audit strict types

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-audit-types.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Apply strict TypeScript fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'marker not found in {path}: {old[:70]!r}')
              p.write_text(s.replace(old, new, 1))

          p = Path('src/lib/operations.ts')
          s = p.read_text()
          s = s.replace('data.status', 'data["status"]')
          s = s.replace('data.paid_at', 'data["paid_at"]')
          s = s.replace('next.paid_at', 'next["paid_at"]')
          s = s.replace('data.completed_at', 'data["completed_at"]')
          s = s.replace('next.completed_at', 'next["completed_at"]')
          s = s.replace('data.radio_id', 'data["radio_id"]')
          old = '''    if (!others.length) {
              const radioRows = await rest<Array<{ status: string }>>(
                `radios?id=eq.${current.radio_id}&select=status&limit=1`,
              );
              if (radioRows[0]?.status === "maintenance")
                await updateRadioRecord(current.radio_id, { status: "available" });
            }
          '''
          new = '''    if (!others.length) {
              await refreshRadioOperationalStatuses([current.radio_id]);
            }
          '''
          if old in s:
              s = s.replace(old, new, 1)
          old = '''  if (!others.length) {
            const radioRows = await rest<Array<{ status: string }>>(
              `radios?id=eq.${item.radio_id}&select=status&limit=1`,
            );
            if (radioRows[0]?.status === "maintenance")
              await updateRadioRecord(item.radio_id, { status: "available" });
          }
          '''
          new = '''  if (!others.length) {
            await refreshRadioOperationalStatuses([item.radio_id]);
          }
          '''
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)

          replace('src/routes/configuracoes.tsx',
                  'if (!form.name?.trim()) return toast.error("Informe o nome da empresa");',
                  'if (!form.name?.trim()) {\n      toast.error("Informe o nome da empresa");\n      return;\n    }')
          replace('src/routes/configuracoes.tsx',
                  'if (!f.name.trim()) return toast.error("Informe o nome do acessório");\n    if (Number(f.stock_total) < 0 || Number(f.unit_cost) < 0)\n      return toast.error("Quantidade e valor não podem ser negativos");',
                  'if (!f.name.trim()) {\n      toast.error("Informe o nome do acessório");\n      return;\n    }\n    if (Number(f.stock_total) < 0 || Number(f.unit_cost) < 0) {\n      toast.error("Quantidade e valor não podem ser negativos");\n      return;\n    }')

          replace('src/routes/financeiro.tsx',
                  'if (!f.description.trim() || Number(f.amount) <= 0)\n      return toast.error("Informe descrição e valor maior que zero");',
                  'if (!f.description.trim() || Number(f.amount) <= 0) {\n      toast.error("Informe descrição e valor maior que zero");\n      return;\n    }')

          replace('src/routes/manutencao.tsx', 'statusInfo[m.status] ?? statusInfo.open!', 'statusInfo[m.status] ?? statusInfo["open"]!')
          replace('src/routes/manutencao.tsx',
                  'if (!f.radio_id || !f.issue.trim())\n      return toast.error("Selecione o rádio e informe o problema");',
                  'if (!f.radio_id || !f.issue.trim()) {\n      toast.error("Selecione o rádio e informe o problema");\n      return;\n    }')

          replace('src/routes/radios.tsx',
                  'if (!f.code.trim()) return toast.error("Informe o código patrimonial");\n    if (!f.band) return toast.error("Selecione VHF ou UHF");\n    if (!f.model_id && !f.model.trim()) return toast.error("Informe o modelo do rádio");',
                  'if (!f.code.trim()) {\n      toast.error("Informe o código patrimonial");\n      return;\n    }\n    if (!f.band) {\n      toast.error("Selecione VHF ou UHF");\n      return;\n    }\n    if (!f.model_id && !f.model.trim()) {\n      toast.error("Informe o modelo do rádio");\n      return;\n    }')

          replace('src/routes/locacoes.nova.tsx',
                  'if (!clientId || !pickup || !due) return toast.error("Selecione o cliente e o período");\n      if (new Date(due) <= new Date(pickup))\n        return toast.error("A devolução precisa ser posterior à retirada");',
                  'if (!clientId || !pickup || !due) {\n        toast.error("Selecione o cliente e o período");\n        return;\n      }\n      if (new Date(due) <= new Date(pickup)) {\n        toast.error("A devolução precisa ser posterior à retirada");\n        return;\n      }')
          replace('src/routes/locacoes.nova.tsx',
                  'if (step === 1 && !selected.length) return toast.error("Selecione pelo menos um rádio");',
                  'if (step === 1 && !selected.length) {\n      toast.error("Selecione pelo menos um rádio");\n      return;\n    }')

          replace('src/routes/devolucao.$rentalId.tsx',
                  'if (checked !== radios.length) return toast.error("Confira todos os rádios antes de finalizar");',
                  'if (checked !== radios.length) {\n      toast.error("Confira todos os rádios antes de finalizar");\n      return;\n    }')
          replace('src/routes/devolucao.$rentalId.tsx',
                  'return toast.error(`Confira a quantidade de ${accessory.accessories?.name || "acessório"}`);',
                  'toast.error(`Confira a quantidade de ${accessory.accessories?.name || "acessório"}`);\n        return;')
          replace('src/routes/devolucao.$rentalId.tsx',
                  'async function finish() {\n    if (busy) return;',
                  'async function finish() {\n    if (busy || !rental) return;\n    const currentRental = rental;')
          replace('src/routes/devolucao.$rentalId.tsx',
                  'await saveReturnOperational(rental, states, accessoryReturns, notes.trim());',
                  'await saveReturnOperational(currentRental, states, accessoryReturns, notes.trim());')

          replace('src/routes/locacoes.index.tsx',
                  'async function save() {\n    if (!f.client_id || !selected.length)\n      return toast.error("Selecione o cliente e pelo menos um rádio");\n    if (new Date(f.due) <= new Date(f.pickup))\n      return toast.error("A devolução precisa ser posterior à retirada");\n    if (selected.some((id) => blocked.has(id)))\n      return toast.error("Há rádio selecionado com conflito neste período");',
                  'async function save() {\n    if (!rental) return;\n    const currentRental = rental;\n    if (!f.client_id || !selected.length) {\n      toast.error("Selecione o cliente e pelo menos um rádio");\n      return;\n    }\n    if (new Date(f.due) <= new Date(f.pickup)) {\n      toast.error("A devolução precisa ser posterior à retirada");\n      return;\n    }\n    if (selected.some((id) => blocked.has(id))) {\n      toast.error("Há rádio selecionado com conflito neste período");\n      return;\n    }')
          replace('src/routes/locacoes.index.tsx', 'await updateRentalOperational(rental, data);', 'await updateRentalOperational(currentRental, data);')
          replace('src/routes/locacoes.index.tsx',
                  '{\n          ...rental,\n          pickup_at: data.pickup_at,',
                  '{\n          ...currentRental,\n          pickup_at: data.pickup_at,')
          PY
      - run: bunx prettier --write src
      - name: Commit strict type fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git diff --cached --quiet || (git commit -m "fix: satisfy strict types across audited flows" && git push)
