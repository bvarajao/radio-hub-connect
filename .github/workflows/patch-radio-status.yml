name: Patch radio status consistency

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-radio-status.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Patch operational radio status logic
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/lib/operations.ts')
          s = p.read_text()

          marker = '''async function deleteRows(path: string) {
            return rest<unknown>(path, {
              method: "DELETE",
              headers: { Prefer: "return=minimal" },
            });
          }
          '''
          helper = '''
          async function refreshRadioOperationalStatuses(radioIds: string[]) {
            const ids = [...new Set(radioIds.filter(Boolean))];
            if (!ids.length) return;

            const [radios, maintenance, rentalLinks] = await Promise.all([
              rest<Array<{ id: string; status: string }>>(
                `radios?id=in.(${inFilter(ids)})&select=id,status`,
              ),
              rest<Array<{ radio_id: string }>>(
                `maintenance_orders?radio_id=in.(${inFilter(ids)})&status=in.(open,in_progress,waiting_parts)&select=radio_id`,
              ),
              rest<Array<{ radio_id: string; rentals?: { status: string } | null }>>(
                `rental_radios?radio_id=in.(${inFilter(ids)})&select=radio_id,rentals(status)`,
              ),
            ]);

            const maintenanceIds = new Set(maintenance.map((m) => m.radio_id));
            const rentedIds = new Set(
              rentalLinks
                .filter((link) => link.rentals && ["active", "late"].includes(link.rentals.status))
                .map((link) => link.radio_id),
            );

            await Promise.all(
              radios.map(async (radio) => {
                if (["lost", "inactive"].includes(radio.status)) return;
                const nextStatus = maintenanceIds.has(radio.id)
                  ? "maintenance"
                  : rentedIds.has(radio.id)
                    ? "rented"
                    : "available";
                if (nextStatus !== radio.status) await updateRadioRecord(radio.id, { status: nextStatus });
              }),
            );
          }
          '''
          if 'async function refreshRadioOperationalStatuses' not in s:
              if marker not in s:
                  raise SystemExit('deleteRows marker not found')
              s = s.replace(marker, marker + helper, 1)

          update_fn = r'''export async function updateRentalOperational\([\s\S]*?\n}\n\nexport async function replaceRentalRadios'''
          update_replacement = '''export async function updateRentalOperational(
            rental: OperationalRental,
            data: {
              client_id: string;
              event_name: string | null;
              pickup_at: string;
              due_at: string;
              subtotal: number;
              discount: number;
              surcharge: number;
              total: number;
              payment_status: string;
              payment_method: string | null;
              deposit_amount: number;
              notes: string | null;
            },
          ) {
            if (["returned", "cancelled"].includes(rental.status)) throw new Error("Esta locação já foi encerrada e não pode ser editada.");
            if (new Date(data.due_at) <= new Date(data.pickup_at)) throw new Error("A devolução precisa ser posterior à retirada.");

            const radioIds = (rental.rental_radios || []).map((r) => r.radio_id);
            const blocked = await blockedRadioIdsForPeriod(data.pickup_at, data.due_at, rental.id);
            if (radioIds.some((id) => blocked.has(id))) throw new Error("A nova data conflita com outra reserva de um dos rádios.");

            const now = new Date();
            const status = new Date(data.pickup_at) > now ? "reserved" : new Date(data.due_at) < now ? "late" : "active";
            const rows = await rest<OperationalRental[]>(`rentals?id=eq.${rental.id}&select=*`, {
              method: "PATCH",
              headers: { Prefer: "return=representation" },
              body: JSON.stringify({ ...data, status }),
            });

            if (radioIds.length) await refreshRadioOperationalStatuses(radioIds);

            await rebuildRentalFinance({
              id: rental.id,
              code: rental.code,
              client_id: data.client_id,
              event_name: data.event_name,
              total: data.total,
              deposit_amount: data.deposit_amount,
              payment_status: data.payment_status,
              payment_method: data.payment_method,
            });

            return rows;
          }

          export async function replaceRentalRadios'''
          s, count = re.subn(update_fn, update_replacement, s, count=1)
          if count != 1:
              raise SystemExit('updateRentalOperational function not found')

          replace_fn = r'''export async function replaceRentalRadios\([\s\S]*?\n}\n\nexport async function cancelRental'''
          replace_replacement = '''export async function replaceRentalRadios(rental: OperationalRental, nextRadioIds: string[]) {
            if (["returned", "cancelled"].includes(rental.status)) throw new Error("Não é possível alterar equipamentos de uma locação encerrada.");
            if (!nextRadioIds.length) throw new Error("A locação precisa ter pelo menos um rádio.");

            const blocked = await blockedRadioIdsForPeriod(rental.pickup_at, rental.due_at, rental.id);
            if (nextRadioIds.some((id) => blocked.has(id))) throw new Error("Um dos rádios escolhidos está comprometido neste período.");

            const currentIds = (rental.rental_radios || []).map((r) => r.radio_id);
            const removed = currentIds.filter((id) => !nextRadioIds.includes(id));
            const added = nextRadioIds.filter((id) => !currentIds.includes(id));

            if (removed.length) {
              await deleteRows(`rental_radios?rental_id=eq.${rental.id}&radio_id=in.(${inFilter(removed)})`);
            }

            if (added.length) {
              await rest("rental_radios", {
                method: "POST",
                headers: { Prefer: "return=minimal" },
                body: JSON.stringify(
                  added.map((radioId) => ({
                    rental_id: rental.id,
                    radio_id: radioId,
                    daily_rate: 0,
                    checkout_condition: "ok",
                  })),
                ),
              });
            }

            if (removed.length || added.length) {
              await refreshRadioOperationalStatuses([...removed, ...added]);
            }
          }

          export async function cancelRental'''
          s, count = re.subn(replace_fn, replace_replacement, s, count=1)
          if count != 1:
              raise SystemExit('replaceRentalRadios function not found')

          cancel_fn = r'''export async function cancelRental\([\s\S]*?\n}\n\nexport async function saveReturnOperational'''
          cancel_replacement = '''export async function cancelRental(rental: OperationalRental) {
            if (rental.status === "returned") throw new Error("Uma locação já devolvida não pode ser cancelada.");
            if (rental.status === "cancelled") return;

            await rest(`rentals?id=eq.${rental.id}`, {
              method: "PATCH",
              headers: { Prefer: "return=minimal" },
              body: JSON.stringify({ status: "cancelled" }),
            });

            const radioIds = (rental.rental_radios || []).map((r) => r.radio_id);
            if (radioIds.length) await refreshRadioOperationalStatuses(radioIds);

            await rest(`financial_transactions?rental_id=eq.${rental.id}&status=in.(pending,overdue)`, {
              method: "PATCH",
              headers: { Prefer: "return=minimal" },
              body: JSON.stringify({ status: "cancelled" }),
            });
          }

          export async function saveReturnOperational'''
          s, count = re.subn(cancel_fn, cancel_replacement, s, count=1)
          if count != 1:
              raise SystemExit('cancelRental function not found')

          p.write_text(s)
          PY
      - run: bunx prettier --write src/lib/operations.ts
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/operations.ts
          git diff --cached --quiet || (git commit -m "fix: keep radio status consistent across future reservations" && git push)
