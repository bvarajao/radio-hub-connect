name: Final UI hardening

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/final-ui-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Align radio status editor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/routes/radios.tsx')
          s = p.read_text()
          s = s.replace('...(radio && !["rented", "reserved"].includes(radio.status) ? { status: f.status } : {}),', '...(radio && !["rented", "reserved", "maintenance"].includes(radio.status) ? { status: f.status } : {}),')
          s = s.replace('{radio && !["rented", "reserved"].includes(radio.status) && (', '{radio && !["rented", "reserved", "maintenance"].includes(radio.status) && (')
          s = s.replace('                  <SelectItem value="maintenance">Manutenção</SelectItem>\n', '')
          marker = '          <div className="space-y-1.5 sm:col-span-2">\n            <Label>Observações</Label>'
          info = '''          {radio?.status === "maintenance" && (\n            <div className="rounded-xl border border-amber-200 bg-amber-50 p-3 text-xs text-amber-900 sm:col-span-2">\n              O status de manutenção é controlado pelo módulo Manutenção. Finalize ou cancele a ordem por lá para liberar o rádio.\n            </div>\n          )}\n'''
          if marker not in s:
              raise SystemExit('marker not found')
          s = s.replace(marker, info + marker, 1)
          p.write_text(s)
          PY
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write src/routes/radios.tsx
      - run: bunx tsc --noEmit
      - run: bun run build
      - run: bun run lint
      - name: Commit UI hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/radios.tsx
          git commit -m "fix: keep radio status consistent with maintenance"
          git push
